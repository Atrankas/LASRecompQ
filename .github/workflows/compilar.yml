name: Compilar APK Android

on:
  workflow_dispatch: # Esto activa el botón manual para iniciar la compilación

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar variables del SDK de Android
      run: |
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV

    - name: Instalar Android NDK 27.2.12479018
      run: |
        yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
        /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018"

    - name: Modificar script para compilar en Linux de Actions
      run: |
        NDK_PATH="/usr/local/lib/android/sdk/ndk/27.2.12479018"
        sed -i "s|^SDK=.*|SDK=\"/usr/local/lib/android/sdk\"|g" tools/android/build_deps.sh
        sed -i "s|^NDK=.*|NDK=\"$NDK_PATH\"|g" tools/android/build_deps.sh
        sed -i '/shasum -a 256/d' tools/android/build_deps.sh
        sed -i 's/--host-cc=.*/--host-cc=gcc \\/g' tools/android/build_deps.sh

    - name: Compilar Dependencias Nativas (FFmpeg, Shaderc, etc)
      run: |
        chmod +x tools/android/build_deps.sh
        ./tools/android/build_deps.sh

    - name: Compilar Entorno Interno (On-Device Build)
      run: |
        chmod +x tools/android/ondevice/build_all.sh
        ./tools/android/ondevice/build_all.sh

    - name: Compilar el APK Final con Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease -PonDeviceBuild=true

    - name: Generar Clave de Firma y Firmar APK (Opción B)
      run: |
        # 1. Generamos un almacén de claves (keystore) temporal de pruebas con la herramienta nativa de Java
        keytool -genkey -v -keystore mi_clave_temporal.keystore -alias clave_alias -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass mi_contrasena_secreta -keypass mi_contrasena_secreta -dname "CN=Pruebas, OU=Desarrollo, O=Personal, L=Ciudad, S=Estado, C=ES"
        
        # 2. Buscamos la herramienta apksigner integrada en el SDK Build-Tools de Android
        APKSIGNER=$(find /usr/local/lib/android/sdk/build-tools/ -name apksigner | sort -V | tail -n 1)
        
        # 3. Firmamos el APK que generó Gradle usando la clave recién creada
        $APKSIGNER sign --keystore mi_clave_temporal.keystore --storepass mi_contrasena_secreta --keypass mi_contrasena_secreta \
          --out android/app/build/outputs/apk/release/LASRecomp-Android-Firmado.apk android/app/build/outputs/apk/release/app-release.apk

    - name: Subir el APK resultante como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: LASRecomp-Android-APK
        path: android/app/build/outputs/apk/release/LASRecomp-Android-Firmado.apk
